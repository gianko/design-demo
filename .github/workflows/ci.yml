name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The one gate job of ADR 0009. It runs the same commands as the Mac, on
  # arm64 to match the pinned Playwright image; later steps join this job.
  gate:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      # To comment the contact sheet's link on the PR.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A committed token output that a fresh build would change, or one never
      # committed at all, is stale (ADR 0005). git diff alone misses the second.
      - run: pnpm tokens
      - run: test -z "$(git status --porcelain)" || { git status --short; exit 1; }
      - run: pnpm format:check
      - run: pnpm lint:md
      # Vitest needs no Docker: the tests that render in the pinned image are
      # `pnpm test:gate`'s, in the Gate e2e workflow.
      - run: pnpm test
      # ESLint, tsc, the Storybook build and the Playwright pass in the pinned
      # image. CI is set, so a missing baseline fails instead of being written.
      - run: pnpm gate
      # The Storybook build `pnpm gate` just gated, for the Pages deploy. With
      # no status function in its `if`, a failed step above skips it.
      - uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          name: storybook-static
          path: storybook-static/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: gate-report
          path: gates/out/report/
          if-no-files-found: ignore
      # The self-contained sheet, its shots inlined, uploaded unzipped so the
      # reviewer opens one file. The artifact takes the file's name.
      - uses: actions/upload-artifact@v7
        id: contact-sheet
        if: ${{ !cancelled() }}
        with:
          path: gates/out/contact-sheet/contact-sheet.html
          archive: false
          if-no-files-found: ignore
      # The baselines are approved from the contact sheet, so the PR links it
      # directly. One comment, edited on each push, rather than one per run.
      - if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.contact-sheet.outputs.artifact-url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.contact-sheet.outputs.artifact-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "**Contact sheet** for $SHA: $URL"

  # The second job of ADR 0009 (spec § Pages deploy): on a push to main, once
  # the gate job passes, the gated Storybook at the Pages root and the newest
  # results file's report at /evals/, compared against the baseline it names
  # if it names one. `needs` skips it after a red gate job.
  pages:
    needs: gate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # The report inlines tokens.css and the font files from node_modules.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: storybook-static
          path: _site
      # The checkout holds only committed results files, and --latest takes
      # the run that started last. Screenshots live only in local scratch.
      # With no results file it writes nothing and exits 0, so Storybook
      # still deploys.
      - run: pnpm eval:report --latest --no-screenshots --out _site/evals/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
