name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The one gate job of ADR 0009. It runs the same commands as the Mac, on
  # arm64 to match the pinned Playwright image; later steps join this job.
  gate:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      # To comment the contact sheet's link on the PR.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A committed token output that a fresh build would change, or one never
      # committed at all, is stale (ADR 0005). git diff alone misses the second.
      - run: pnpm tokens
      - run: test -z "$(git status --porcelain)" || { git status --short; exit 1; }
      - run: pnpm format:check
      - run: pnpm lint:md
      - run: pnpm test
      # ESLint, tsc, the Storybook build and the Playwright pass in the pinned
      # image. CI is set, so a missing baseline fails instead of being written.
      - run: pnpm gate
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: gate-report
          path: gates/out/report/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        id: contact-sheet
        if: ${{ !cancelled() }}
        with:
          name: contact-sheet
          path: gates/out/contact-sheet/
          if-no-files-found: ignore
      # The baselines are approved from the contact sheet, so the PR links it
      # directly. One comment, edited on each push, rather than one per run.
      - if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.contact-sheet.outputs.artifact-url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.contact-sheet.outputs.artifact-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "**Contact sheet** for $SHA: $URL"
