name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The one gate job of ADR 0009. It runs the same commands as the Mac, on
  # arm64 to match the pinned Playwright image; later steps join this job.
  gate:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm storybook:build
